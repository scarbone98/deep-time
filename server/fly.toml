# Fly.io app for the Deep Time co-op server. Deploy: ./tools/deploy_server.sh
app = "deep-time-coop"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8910
  force_https = true
  # rooms live in memory: keep one machine up so nobody's game vanishes
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 400

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
